<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>إدارة لمسة</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/assets/favicon.svg" />
    <script type="module" src="/js/admin.js"></script>
  </head>
  <body>
    <main class="admin-wrap">
      <div class="section-head">
        <div>
          <p class="kicker">LAMSA / ADMINISTRATION</p>
          <h1>مساحة إدارة المتجر</h1>
        </div>
        <a class="text-link" href="/">عرض المتجر ←</a>
      </div>
      <div id="admin-login" class="login admin-card">
        <h2>تسجيل الدخول</h2>
        <form id="login">
          <label class="field"
            >اسم المستخدم<input
              name="username"
              autocomplete="username"
              required
              maxlength="80" /></label
          ><label class="field"
            >كلمة المرور<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="200" /></label
          ><button class="btn">دخول آمن</button>
          <p id="login-error" role="alert"></p>
        </form>
        <p class="login-note">
          لا توجد بيانات دخول افتراضية. أنشئي حساب الإدارة من الطرفية كما هو
          موضح في README.
        </p>
      </div>
      <div id="admin-area" hidden>
        <nav class="admin-nav" aria-label="أقسام الإدارة">
          <button class="btn light" data-tab="overview">نظرة عامة</button
          ><button class="btn light" data-tab="products">المنتجات</button
          ><button class="btn light" data-tab="orders">الطلبات</button
          ><button class="btn light" data-tab="shipping">التوصيل</button
          ><button class="btn light" data-tab="settings">الإعدادات</button
          ><button class="btn light" id="logout">خروج</button>
        </nav>
        <div id="admin-message" role="status"></div>
        <section id="admin-content"></section>
      </div>
    </main>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
